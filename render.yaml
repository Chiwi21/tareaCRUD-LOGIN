services:
  - type: web
    name: tradelab
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python migrate_legacy.py && python seed.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      - key: SEED_DEMO
        value: "1"
