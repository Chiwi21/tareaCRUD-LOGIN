services:
  - type: web
    name: international-trade-v3
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python prepare_production.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
