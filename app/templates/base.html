<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema de gestión de importaciones y exportaciones con autenticación y CRUD - Tarea 3">
    <title>{% block title %}Import/Export System{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="header">
        <div class="header__container">
            <a class="header__brand" href="/">Import<span>/</span>Export</a>
            {% if user %}
            <nav class="nav">
                <a class="nav__link" href="/dashboard">Panel</a>
                {% if user.role == 'ADMIN' %}
                <a class="nav__link" href="/operations">Operaciones</a>
                <a class="nav__link" href="/admin/users">Usuarios</a>
                {% endif %}
                <span class="nav__user">{{ user.username }} · {{ ROLES[user.role] }}</span>
                <form class="nav__logout" method="post" action="/logout">
                    <button class="btn btn--outline btn--sm" type="submit">Cerrar sesión</button>
                </form>
            </nav>
            {% endif %}
        </div>
    </header>

    <main class="main">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>Ingeniería Web · Tarea 3: CRUD / Login con MVC · FastAPI + SQLite + Jinja2</p>
    </footer>
</body>
</html>
